[workspace]
resolver = "2"
# All crates build without `protoc`: `andrias-proto` ships hand-vendored prost/
# tonic bindings (crates/andrias-proto/src/{common,external,program}.rs), so the
# whole workspace — proto and the gRPC gateway included — is one default build
# set. No `default-members` carve-out is needed.
members = [
    "crates/andrias-types",
    "crates/andrias-graph",
    "crates/andrias-state",
    "crates/andrias-kernel",
    "crates/andrias-storage-redb",
    "crates/andrias-plan",
    "crates/andrias-standard",
    "crates/andrias-gateway",
    "crates/andrias-proto",
    "crates/andrias-gateway-grpc",
    "crates/andrias-gateway-mcp",
    "crates/andrias-sim",
    "crates/andrias-sdk",
    "crates/andrias-daemon",
    "crates/andrias-console",
    "crates/andrias-gateway-websocket",
]

[workspace.package]
version      = "0.1.0"
edition      = "2024"
rust-version = "1.95"
license      = "MIT"
authors      = ["noctiro"]
repository   = "https://github.com/andrias-dev/andrias"
description  = "Capability runtime for model calls, tool access, memory, state, and extensions"

[workspace.lints.rust]
bare_trait_objects = "deny"
future_incompatible = { level = "deny", priority = -1 }
non_ascii_idents = "deny"
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
unfulfilled_lint_expectations = "deny"
unused_must_use = "deny"
warnings = "deny"

[workspace.lints.clippy]
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
expect_used = "deny"
exit = "deny"
mem_forget = "deny"
panic = "deny"
panic_in_result_fn = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_in_result = "deny"
unwrap_used = "deny"

[workspace.dependencies]
andrias-standard = { version = "0.1.0", path = "crates/andrias-standard", default-features = false }
andrias-console = { version = "0.1.0", path = "crates/andrias-console" }
andrias-gateway = { version = "0.1.0", path = "crates/andrias-gateway" }
andrias-gateway-grpc = { version = "0.1.0", path = "crates/andrias-gateway-grpc" }
andrias-gateway-mcp = { version = "0.1.0", path = "crates/andrias-gateway-mcp" }
andrias-gateway-websocket = { version = "0.1.0", path = "crates/andrias-gateway-websocket" }
andrias-graph = { version = "0.1.0", path = "crates/andrias-graph" }
andrias-kernel = { version = "0.1.0", path = "crates/andrias-kernel" }
andrias-plan = { version = "0.1.0", path = "crates/andrias-plan" }
andrias-proto = { version = "0.1.0", path = "crates/andrias-proto" }
andrias-sdk = { version = "0.1.0", path = "crates/andrias-sdk" }
andrias-state = { version = "0.1.0", path = "crates/andrias-state" }
andrias-storage-redb = { version = "0.1.0", path = "crates/andrias-storage-redb" }
andrias-types = { version = "0.1.0", path = "crates/andrias-types" }

anyhow = { version = "1.0.102", default-features = false }
argon2 = { version = "0.5.3", default-features = false }
async-trait = { version = "0.1.89", default-features = false }
axum = { version = "0.8.9", default-features = false }
base64 = { version = "0.22.1", default-features = false }
bitflags = { version = "2.13.0", default-features = false }
blake3 = { version = "1.8.5", default-features = false }
chacha20poly1305 = { version = "0.10.1", default-features = false }
criterion = { version = "0.8.2", default-features = false }
dashmap = { version = "6.2.1", default-features = false }
dotenvy = { version = "0.15.7", default-features = false }
ed25519-dalek = { version = "2.2.0", default-features = false }
futures-util = { version = "0.3.32", default-features = false }
getrandom = { version = "0.4.2", default-features = false }
glob = { version = "0.3.3", default-features = false }
hkdf = { version = "0.13.0", default-features = false }
hmac = { version = "0.13.0", default-features = false }
parking_lot = { version = "0.12.5", default-features = false }
prost = { version = "0.14.4", default-features = false }
redb = { version = "4.1.0", default-features = false }
reqwest = { version = "0.13.4", default-features = false }
rmp-serde = { version = "1.3.1", default-features = false }
serde = { version = "1.0.228", default-features = false }
serde_json = { version = "1.0.150", default-features = false }
sha1 = { version = "0.11.0", default-features = false }
sha2 = { version = "0.11.0", default-features = false }
smol_str = { version = "0.3.6", default-features = false }
std-uritemplate = { version = "2.0.10", default-features = false }
subtle = { version = "2.6.1", default-features = false }
tempfile = { version = "3.27.0", default-features = false }
thiserror = { version = "2.0.18", default-features = false }
tokio = { version = "1.52.3", default-features = false }
toml = { version = "1.1.2", default-features = false }
