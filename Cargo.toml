[workspace]
resolver = "2"
# All crates build without `protoc`: `nexus-proto` ships hand-vendored prost/
# tonic bindings (crates/nexus-proto/src/{common,gateway,extension}.rs), so the
# whole workspace — proto and the gRPC gateway included — is one default build
# set. No `default-members` carve-out is needed.
members = [
    "crates/nexus-types",
    "crates/nexus-graph",
    "crates/nexus-state",
    "crates/nexus-kernel",
    "crates/nexus-storage-redb",
    "crates/nexus-plan",
    "crates/nexus-actors",
    "crates/nexus-gateway",
    "crates/nexus-proto",
    "crates/nexus-gateway-grpc",
    "crates/nexus-gateway-mcp",
    "crates/nexus-sim",
    "crates/nexus-sdk",
    "crates/nexus-daemon",
    "crates/nexus-console",
    "crates/nexus-gateway-websocket",
]

[workspace.package]
version      = "0.1.0"
edition      = "2024"
rust-version = "1.95"
license      = "MIT"
authors      = ["noctiro"]
repository   = "https://github.com/noctiro/nexus"
description  = "Capability runtime for model calls, tool access, memory, state, and extensions"

[workspace.dependencies]
nexus-actors = { version = "0.1.0", path = "crates/nexus-actors" }
nexus-console = { version = "0.1.0", path = "crates/nexus-console" }
nexus-gateway = { version = "0.1.0", path = "crates/nexus-gateway" }
nexus-gateway-grpc = { version = "0.1.0", path = "crates/nexus-gateway-grpc" }
nexus-gateway-mcp = { version = "0.1.0", path = "crates/nexus-gateway-mcp" }
nexus-gateway-websocket = { version = "0.1.0", path = "crates/nexus-gateway-websocket" }
nexus-graph = { version = "0.1.0", path = "crates/nexus-graph" }
nexus-kernel = { version = "0.1.0", path = "crates/nexus-kernel" }
nexus-plan = { version = "0.1.0", path = "crates/nexus-plan" }
nexus-proto = { version = "0.1.0", path = "crates/nexus-proto" }
nexus-sdk = { version = "0.1.0", path = "crates/nexus-sdk" }
nexus-state = { version = "0.1.0", path = "crates/nexus-state" }
nexus-storage-redb = { version = "0.1.0", path = "crates/nexus-storage-redb" }
nexus-types = { version = "0.1.0", path = "crates/nexus-types" }

anyhow = "1.0.102"
argon2 = { version = "0.5.3", default-features = false }
async-trait = "0.1.89"
axum = { version = "0.8.9", default-features = false }
base64 = { version = "0.22.1", default-features = false, features = ["alloc"] }
bitflags = "2.13.0"
blake3 = { version = "1.8.5", default-features = false, features = ["std"] }
chacha20poly1305 = { version = "0.10.1", default-features = false }
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
dashmap = "6.2.1"
dotenvy = "0.15.7"
ed25519-dalek = "2.2.0"
futures-util = { version = "0.3.32", default-features = false, features = ["sink", "std"] }
getrandom = "0.4.2"
glob = "0.3.3"
hkdf = "0.13.0"
hmac = "0.13.0"
parking_lot = "0.12.5"
prost = "0.14.4"
redb = "4.1.0"
reqwest = { version = "0.13.4", default-features = false }
rmp-serde = "1.3.1"
serde = { version = "1.0.228", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0.150", default-features = false, features = ["std"] }
sha1 = { version = "0.11.0", default-features = false }
sha2 = { version = "0.11.0", default-features = false }
smol_str = { version = "0.3.6", default-features = false, features = ["serde", "std"] }
subtle = { version = "2.6.1", default-features = false }
tempfile = "3.27.0"
thiserror = { version = "2.0.18", default-features = false, features = ["std"] }
tokio = { version = "1.52.3", default-features = false }
toml = { version = "1.1.2", default-features = false }
tonic = { version = "0.14.6", default-features = false }
tonic-prost = "0.14.6"
tower-http = { version = "0.6.11", default-features = false }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false }
url = "2.5.8"
yaml_serde = "0.10.4"

[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
strip         = "symbols"

[profile.dev]
opt-level = 1
