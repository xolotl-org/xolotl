[package]
name = "nexus-gateway-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "MCP protocol adapter for Nexus"

[dependencies]
nexus-gateway = { version = "0.1.0", path = "../nexus-gateway" }
nexus-graph = { version = "0.1.0", path = "../nexus-graph" }
nexus-kernel = { version = "0.1.0", path = "../nexus-kernel" }
nexus-types = { version = "0.1.0", path = "../nexus-types" }
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.18"

[dev-dependencies]
tokio = { version = "1.52.3", features = ["rt", "macros"] }
