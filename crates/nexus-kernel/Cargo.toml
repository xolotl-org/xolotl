[package]
name = "nexus-kernel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = { workspace = true, default-features = false }
blake3 = { workspace = true, default-features = false, features = ["std"] }
futures-util = { workspace = true, default-features = false, features = ["std"] }
nexus-graph.workspace = true
nexus-state.workspace = true
nexus-types.workspace = true
parking_lot = { workspace = true, default-features = false }
serde = { workspace = true, default-features = false, features = ["derive", "std"] }
thiserror = { workspace = true, default-features = false, features = ["std"] }
tokio = { workspace = true, default-features = false, features = ["rt", "sync", "macros", "time", "rt-multi-thread"] }
tracing = { workspace = true, default-features = false, features = ["std"] }

[dev-dependencies]
anyhow = { workspace = true, default-features = false, features = ["std"] }
criterion = { workspace = true, default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "kernel_hot_paths"
harness = false
