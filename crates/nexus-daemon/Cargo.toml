[package]
name = "nexus-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "nexusd — the long-running Nexus host process"

[[bin]]
name = "nexusd"
path = "src/main.rs"

[features]
default = ["grpc"]
# gRPC gateway. `nexus-proto`'s bindings are vendored (no `protoc` needed), so
# this is on by default. Disable it for a smaller build without gRPC clients.
grpc = ["dep:nexus-gateway-grpc", "dep:tonic"]

[dependencies]
anyhow = "1.0.102"
axum = "0.8.9"
dotenvy = "0.15.7"
nexus-actors = { version = "0.1.0", path = "../nexus-actors" }
nexus-console = { version = "0.1.0", path = "../nexus-console" }
nexus-gateway = { version = "0.1.0", path = "../nexus-gateway" }
nexus-gateway-grpc = { version = "0.1.0", path = "../nexus-gateway-grpc", optional = true }
nexus-gateway-websocket = { version = "0.1.0", path = "../nexus-gateway-websocket" }
nexus-sdk = { version = "0.1.0", path = "../nexus-sdk" }
nexus-storage-redb = { version = "0.1.0", path = "../nexus-storage-redb" }
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.52.3", features = ["rt", "sync", "macros", "rt-multi-thread", "signal"] }
toml = "0.8"
tonic = { version = "0.14.6", features = ["server", "transport"], optional = true }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
