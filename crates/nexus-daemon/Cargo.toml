[package]
name = "nexus-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "nexusd — the long-running Nexus host process"

[lints]
workspace = true

[[bin]]
name = "nexusd"
path = "src/main.rs"

[features]
default = ["external-grpc", "external-websocket"]
external-gateway = ["dep:tonic"]
external-grpc = ["external-gateway", "dep:nexus-gateway-grpc", "tonic/server", "tonic/tls-ring"]
external-websocket = ["external-gateway", "dep:nexus-gateway-websocket"]

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
blake3.workspace = true
dotenvy.workspace = true
getrandom.workspace = true
nexus-actors.workspace = true
nexus-console.workspace = true
nexus-gateway.workspace = true
nexus-gateway-grpc = { workspace = true, optional = true }
nexus-gateway-websocket = { workspace = true, optional = true }
nexus-kernel.workspace = true
nexus-sdk.workspace = true
nexus-storage-redb.workspace = true
nexus-types.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "macros", "rt-multi-thread", "signal", "time"] }
toml = { workspace = true, features = ["parse", "serde", "std"] }
tonic = { workspace = true, optional = true }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }

[dev-dependencies]
nexus-proto.workspace = true
