[package]
name = "nexus-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "nexusd — the long-running Nexus host process"

[[bin]]
name = "nexusd"
path = "src/main.rs"

[features]
default = ["external-grpc", "external-websocket"]
external-gateway = ["dep:tonic"]
external-grpc = ["external-gateway", "dep:nexus-gateway-grpc", "tonic/server", "tonic/tls-ring"]
external-websocket = ["external-gateway", "dep:nexus-gateway-websocket"]

[dependencies]
anyhow = "1.0.102"
async-trait = "0.1.89"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
blake3 = "1.8.5"
dotenvy = "0.15.7"
getrandom = "0.4.2"
nexus-actors = { version = "0.1.0", path = "../nexus-actors" }
nexus-console = { version = "0.1.0", path = "../nexus-console" }
nexus-gateway = { version = "0.1.0", path = "../nexus-gateway" }
nexus-gateway-grpc = { version = "0.1.0", path = "../nexus-gateway-grpc", optional = true }
nexus-gateway-websocket = { version = "0.1.0", path = "../nexus-gateway-websocket", optional = true }
nexus-kernel = { version = "0.1.0", path = "../nexus-kernel" }
nexus-sdk = { version = "0.1.0", path = "../nexus-sdk" }
nexus-storage-redb = { version = "0.1.0", path = "../nexus-storage-redb" }
nexus-types = { version = "0.1.0", path = "../nexus-types" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.52.3", features = ["rt", "sync", "macros", "rt-multi-thread", "signal", "time"] }
toml = "1.1.2"
tonic = { version = "0.14.6", default-features = false, optional = true }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

[dev-dependencies]
nexus-proto = { version = "0.1.0", path = "../nexus-proto" }
