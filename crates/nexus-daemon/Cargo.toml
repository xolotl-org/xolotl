[package]
name = "nexus-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "nexusd — the long-running Nexus host process"

[lints]
workspace = true

[[bin]]
name = "nexusd"
path = "src/main.rs"

[features]
default = ["external-grpc", "external-websocket"]
external-gateway = ["dep:tonic"]
external-grpc = ["external-gateway", "dep:nexus-gateway-grpc", "tonic/server", "tonic/tls-ring"]
external-websocket = ["external-gateway", "dep:nexus-gateway-websocket"]
fetch = ["nexus-standard/fetch"]
fs = ["nexus-standard/fs"]
http-inference = ["nexus-standard/http-inference"]
openai-responses = ["nexus-standard/openai-responses"]
openai-chat = ["nexus-standard/openai-chat"]
anthropic-messages = ["nexus-standard/anthropic-messages"]
gemini-generate-content = ["nexus-standard/gemini-generate-content"]
terminal = ["nexus-standard/terminal"]

[dependencies]
anyhow = { workspace = true, default-features = false, features = ["std"] }
async-trait = { workspace = true, default-features = false }
blake3 = { workspace = true, default-features = false, features = ["std"] }
dotenvy = { workspace = true, default-features = false }
getrandom = { workspace = true, default-features = false }
nexus-standard = { workspace = true, default-features = false, features = ["standard"] }
nexus-console.workspace = true
nexus-gateway.workspace = true
nexus-gateway-grpc = { workspace = true, optional = true }
nexus-gateway-websocket = { workspace = true, optional = true }
nexus-kernel.workspace = true
nexus-sdk.workspace = true
nexus-state.workspace = true
nexus-storage-redb.workspace = true
nexus-types.workspace = true
serde = { workspace = true, default-features = false, features = ["derive", "std"] }
serde_json = { workspace = true, default-features = false, features = ["std"] }
tokio = { workspace = true, default-features = false, features = ["rt", "sync", "macros", "rt-multi-thread", "signal", "time"] }
toml = { workspace = true, default-features = false, features = ["parse", "serde", "std"] }
tonic = { workspace = true, default-features = false, optional = true }
tracing = { workspace = true, default-features = false, features = ["std"] }
tracing-subscriber = { workspace = true, default-features = false, features = ["env-filter", "fmt"] }

[dev-dependencies]
nexus-proto.workspace = true
