[package]
name = "xolotl-standard"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Standard in-process implementations for Xolotl"

[lints]
workspace = true

[features]
default = ["standard"]
standard = ["standard-core"]
standard-core = ["proc", "dep:blake3", "dep:getrandom", "dep:half", "tokio/time"]
fetch = ["standard-core", "dep:reqwest", "dep:url"]
fs = ["standard-core", "dep:glob", "tokio/fs"]
http-inference = [
    "openai-responses",
    "openai-chat",
    "anthropic-messages",
    "gemini-generate-content",
]
http-stream = ["dep:bytes", "dep:futures-util"]
openai-responses = ["standard-core", "dep:reqwest", "http-stream"]
openai-chat = ["standard-core", "dep:reqwest", "http-stream"]
anthropic-messages = ["standard-core", "dep:reqwest", "http-stream"]
gemini-generate-content = ["standard-core", "dep:reqwest", "http-stream"]
proc = ["tokio/io-util", "tokio/process"]
terminal = ["standard-core", "tokio/io-util", "tokio/process"]
value-objects = ["dep:xolotl-value-codec", "dep:xolotl-value-object", "xolotl-value-object/cbor"]

[dependencies]
async-trait = { workspace = true, default-features = false }
bytes = { workspace = true, features = ["std"], optional = true }
futures-util = { workspace = true, default-features = false, features = ["std"], optional = true }
blake3 = { workspace = true, default-features = false, features = ["std"], optional = true }
getrandom = { workspace = true, default-features = false, optional = true }
glob = { workspace = true, default-features = false, optional = true }
half = { workspace = true, default-features = false, optional = true }
xolotl-graph.workspace = true
xolotl-kernel = { workspace = true, features = ["host"] }
xolotl-state.workspace = true
xolotl-types.workspace = true
xolotl-value-codec = { workspace = true, optional = true }
xolotl-value-object = { workspace = true, optional = true }
parking_lot = { workspace = true, default-features = false }
reqwest = { workspace = true, default-features = false, features = ["rustls", "stream"], optional = true }
serde = { workspace = true, default-features = false, features = ["derive", "std"] }
serde_json = { workspace = true, default-features = false, features = ["std"] }
thiserror = { workspace = true, default-features = false, features = ["std"] }
tokio = { workspace = true, default-features = false, features = ["rt", "sync", "macros"] }
url = { workspace = true, default-features = false, features = ["std"], optional = true }

[dev-dependencies]
xolotl-storage-fs.workspace = true
anyhow = { workspace = true, default-features = false, features = ["std"] }
criterion = { workspace = true, default-features = false, features = ["cargo_bench_support"] }
tempfile = { workspace = true, default-features = false, features = ["getrandom"] }

[[bench]]
name = "standard_drivers"
harness = false
