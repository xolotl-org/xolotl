[package]
name = "andrias-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "andriasd — the long-running Andrias host process"

[lints]
workspace = true

[[bin]]
name = "andriasd"
path = "src/main.rs"

[features]
default = ["external-grpc", "external-websocket"]
external-gateway = ["dep:tonic"]
external-grpc = ["external-gateway", "dep:andrias-gateway-grpc", "tonic/server", "tonic/tls-ring"]
external-websocket = ["external-gateway", "dep:andrias-gateway-websocket"]
fetch = ["andrias-standard/fetch"]
fs = ["andrias-standard/fs"]
http-inference = ["andrias-standard/http-inference"]
openai-responses = ["andrias-standard/openai-responses"]
openai-chat = ["andrias-standard/openai-chat"]
anthropic-messages = ["andrias-standard/anthropic-messages"]
gemini-generate-content = ["andrias-standard/gemini-generate-content"]
terminal = ["andrias-standard/terminal"]

[dependencies]
anyhow = { workspace = true, default-features = false, features = ["std"] }
async-trait = { workspace = true, default-features = false }
blake3 = { workspace = true, default-features = false, features = ["std"] }
dotenvy = { workspace = true, default-features = false }
getrandom = { workspace = true, default-features = false }
andrias-standard = { workspace = true, default-features = false, features = ["standard"] }
andrias-console.workspace = true
andrias-gateway.workspace = true
andrias-gateway-grpc = { workspace = true, optional = true }
andrias-gateway-websocket = { workspace = true, optional = true }
andrias-kernel.workspace = true
andrias-sdk.workspace = true
andrias-state.workspace = true
andrias-storage-redb.workspace = true
andrias-types.workspace = true
serde = { workspace = true, default-features = false, features = ["derive", "std"] }
serde_json = { workspace = true, default-features = false, features = ["std"] }
tokio = { workspace = true, default-features = false, features = ["rt", "sync", "macros", "rt-multi-thread", "signal", "time"] }
toml = { workspace = true, default-features = false, features = ["parse", "serde", "std"] }
tonic = { workspace = true, default-features = false, optional = true }
tracing = { workspace = true, default-features = false, features = ["std"] }
tracing-subscriber = { workspace = true, default-features = false, features = ["env-filter", "fmt"] }

[dev-dependencies]
andrias-proto.workspace = true
