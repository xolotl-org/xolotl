[package]
name = "xolotl-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "xolotld — the long-running Xolotl host process"

[lints]
workspace = true

[[bin]]
name = "xolotld"
path = "src/main.rs"

[features]
default = ["external-grpc", "external-websocket"]
federation-grpc = ["dep:sha2", "dep:xolotl-federation", "dep:xolotl-federation-grpc", "dep:xolotl-federation-kernel", "dep:xolotl-graph", "xolotl-storage-redb/federation", "dep:futures-util", "dep:rustls", "dep:tokio-rustls", "dep:x509-parser", "dep:tonic", "tonic/server", "tokio/net"]
application-grpc = ["dep:xolotl-gateway-grpc", "xolotl-storage-redb/gateway", "dep:futures-util", "dep:rustls", "dep:tokio-rustls", "dep:x509-parser", "dep:tonic", "tonic/server"]
external-grpc = ["dep:xolotl-gateway-grpc", "dep:futures-util", "dep:rustls", "dep:tokio-rustls", "dep:x509-parser", "dep:tonic", "tonic/server"]
external-websocket = ["dep:xolotl-gateway-websocket", "dep:tonic"]
fetch = ["xolotl-standard/fetch", "dep:rustls"]
fs = ["xolotl-standard/fs"]
http-inference = ["xolotl-standard/http-inference", "dep:rustls"]
openai-responses = ["xolotl-standard/openai-responses", "dep:rustls"]
openai-chat = ["xolotl-standard/openai-chat", "dep:rustls"]
anthropic-messages = ["xolotl-standard/anthropic-messages", "dep:rustls"]
gemini-generate-content = ["xolotl-standard/gemini-generate-content", "dep:rustls"]
terminal = ["xolotl-standard/terminal"]

[dependencies]
anyhow = { workspace = true, default-features = false, features = ["std"] }
async-trait = { workspace = true, default-features = false }
blake3 = { workspace = true, default-features = false, features = ["std"] }
dotenvy = { workspace = true, default-features = false }
futures-util = { workspace = true, default-features = false, features = ["std"], optional = true }
getrandom = { workspace = true, default-features = false }
rustls = { workspace = true, default-features = false, features = ["aws-lc-rs", "std"], optional = true }
sha2 = { workspace = true, default-features = false, optional = true }
tokio-rustls = { workspace = true, features = ["aws-lc-rs"], optional = true }
x509-parser = { workspace = true, optional = true }
xolotl-standard = { workspace = true, default-features = false, features = ["standard"] }
xolotl-console = { workspace = true, features = ["http"] }
xolotl-gateway.workspace = true
xolotl-gateway-grpc = { workspace = true, optional = true }
xolotl-gateway-websocket = { workspace = true, optional = true }
xolotl-federation = { workspace = true, optional = true }
xolotl-federation-grpc = { path = "../xolotl-federation-grpc", optional = true }
xolotl-federation-kernel = { workspace = true, optional = true }
xolotl-graph = { workspace = true, optional = true }
xolotl-kernel = { workspace = true, features = ["host"] }
xolotl-sdk = { workspace = true, features = ["host", "memory"] }
xolotl-state.workspace = true
xolotl-source.workspace = true
xolotl-storage-redb = { workspace = true, features = ["console"] }
xolotl-storage-fs.workspace = true
xolotl-types.workspace = true
serde = { workspace = true, default-features = false, features = ["derive", "std"] }
serde_json = { workspace = true, default-features = false, features = ["std"] }
tokio = { workspace = true, default-features = false, features = ["rt", "sync", "macros", "rt-multi-thread", "signal", "time"] }
toml = { workspace = true, default-features = false, features = ["parse", "serde", "std"] }
tonic = { workspace = true, default-features = false, optional = true }
tracing = { workspace = true, default-features = false, features = ["std"] }
thiserror = { workspace = true, default-features = false, features = ["std"] }
tracing-subscriber = { workspace = true, default-features = false, features = ["env-filter", "fmt"] }
zeroize = { workspace = true, features = ["alloc"] }
subtle = { workspace = true, default-features = false }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true, features = ["std"] }

[dev-dependencies]
sha2 = { workspace = true }
tokio = { workspace = true, default-features = false, features = ["test-util"] }
xolotl-kernel = { workspace = true, features = ["memory"] }
xolotl-state = { workspace = true, features = ["memory"] }
tempfile = { workspace = true, default-features = false, features = ["getrandom"] }
xolotl-proto.workspace = true
