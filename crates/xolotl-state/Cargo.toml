[package]
name = "xolotl-state"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description.workspace = true

[lints]
workspace = true

[features]
default = ["memory"]
std = ["dep:serde", "dep:serde_json", "thiserror/std"]
tokio = ["std", "dep:tokio", "dep:tokio-stream", "dep:parking_lot"]
memory = ["std", "tokio", "dep:parking_lot"]
test-support = ["std"]

[dependencies]
xolotl-types.workspace = true
parking_lot = { workspace = true, default-features = false, optional = true }
serde = { workspace = true, optional = true, features = ["derive", "std"] }
serde_json = { workspace = true, default-features = false, features = ["std"], optional = true }
thiserror = { workspace = true, default-features = false }
tokio = { workspace = true, default-features = false, features = ["sync"], optional = true }
tokio-stream = { workspace = true, default-features = false, features = ["sync"], optional = true }

[dev-dependencies]
anyhow = { workspace = true, default-features = false, features = ["std"] }
criterion = { workspace = true, default-features = false, features = ["cargo_bench_support"] }
tokio = { workspace = true, default-features = false, features = ["rt", "sync", "macros", "time", "test-util"] }

[[bench]]
name = "in_memory_state"
harness = false
required-features = ["memory"]

[[example]]
name = "state_footprint"
required-features = ["memory"]
