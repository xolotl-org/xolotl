[package]
name = "xolotl-storage-redb"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "redb-backed persistent storage adapters for Xolotl state and the FactStore"

[lints]
workspace = true

[dependencies]
async-trait = { workspace = true, default-features = false }
xolotl-kernel.workspace = true
xolotl-state.workspace = true
xolotl-types.workspace = true
parking_lot = { workspace = true, default-features = false }
redb = { workspace = true, default-features = false }
serde_json = { workspace = true, default-features = false, features = ["std"] }
tokio = { workspace = true, default-features = false, features = ["sync"] }

[dev-dependencies]
anyhow = { workspace = true, default-features = false, features = ["std"] }
criterion = { workspace = true, default-features = false, features = ["cargo_bench_support"] }
tempfile = { workspace = true, default-features = false, features = ["getrandom"] }
tokio = { workspace = true, default-features = false, features = ["rt", "sync", "macros", "time", "test-util"] }

[[bench]]
name = "redb_storage"
harness = false
