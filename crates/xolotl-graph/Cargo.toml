[package]
name = "xolotl-graph"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Xolotl single execution IR (ExecutionGraph) + Do<A> front-end + Do→Graph compiler"

[lints]
workspace = true

[dependencies]
xolotl-core.workspace = true
xolotl-types.workspace = true
serde = { workspace = true, default-features = false, features = ["derive", "alloc"] }
serde_json = { workspace = true, default-features = false, features = ["alloc"] }
blake3 = { workspace = true, default-features = false }
thiserror = { workspace = true, default-features = false }

[dev-dependencies]
anyhow = { workspace = true, default-features = false, features = ["std"] }
criterion = { workspace = true, default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "graph_hot_paths"
harness = false
