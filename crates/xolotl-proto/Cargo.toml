[package]
name = "xolotl-proto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description.workspace = true

[lints]
workspace = true

[features]
default = []
# Typed client/server bindings over a caller-supplied gRPC service.
grpc = ["dep:tonic", "dep:tonic-prost"]
# Built-in tonic channels and the clients' `connect` constructors.
transport = ["grpc", "tonic/transport"]

[dependencies]
xolotl-graph.workspace = true
xolotl-types.workspace = true
serde_json = { workspace = true, features = ["std"] }
prost = { workspace = true, default-features = false, features = ["derive", "std"] }
thiserror = { workspace = true, default-features = false, features = ["std"] }
tonic = { workspace = true, default-features = false, features = ["codegen"], optional = true }
tonic-prost = { workspace = true, default-features = false, optional = true }

[dev-dependencies]
anyhow = { workspace = true, default-features = false, features = ["std"] }
criterion = { workspace = true, default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "wire_conversion"
harness = false
