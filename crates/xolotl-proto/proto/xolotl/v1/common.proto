syntax = "proto3";
package xolotl.v1;

// Universal addressing type.
// String form: path://[cluster/]<scheme>/<seg>[/<seg>...]
message Path {
  optional string cluster = 1;
  string scheme = 2;
  repeated string segments = 3;
}

// Server-owned lineage, independent of object upload/download authority.
message TaintSet {
  repeated TaintSource sources = 1;
}

message TaintSource {
  message Marker {}
  message Inbound {
    string source = 1;
    string channel = 2;
  }
  oneof kind {
    Marker author_constant = 1;
    Marker model_output = 2;
    Inbound inbound = 3;
    string fetched_host = 4;
    Path protected_path = 5;
  }
}

// Self-describing value (mirrors xolotl_types::Value, including multimodal refs).
message Value {
  oneof kind {
    NullValue null_val = 1;
    bool bool_val = 2;
    int64 int_val = 3;
    double float_val = 4;
    string str_val = 5;
    bytes bytes_val = 6;
    ListValue list_val = 7;
    MapValue map_val = 8;
    BlobRef blob_val = 9;
    TensorRef tensor_val = 10;
    FrameRef frame_val = 11;
    StreamMarker stream_end_val = 12;
  }
}

// End-of-stream sentinel for streamed value sequences.
message StreamMarker {
  oneof kind {
    bool done = 1;          // graceful end
    string error = 2;       // aborted with this message
  }
}

enum NullValue {
  NULL_VALUE = 0;
}

message ListValue {
  repeated Value items = 1;
}

message MapValue {
  map<string, Value> entries = 1;
}

// Pointer to large opaque content in blob storage.
message BlobRef {
  string hash = 1;
  uint64 size = 2;
  optional string mime = 3;
}

// Numeric tensor reference (embedding / waveform / frame / action vector).
message TensorRef {
  BlobRef blob = 1;
  string dtype = 2;        // f16/bf16/f32/f64/i8/i16/i32/i64/u8/bool
  repeated uint64 shape = 3;
}

// A single timestamped media / trajectory / sensor frame.
message FrameRef {
  BlobRef blob = 1;
  int64 ts_nanos = 2;
  string kind = 3;         // audio/video/pose/sensor
}

// Side-effect / replay classification.
enum Purity {
  PURITY_UNSPECIFIED = 0;
  PURITY_PURE = 1;
  PURITY_IDEMPOTENT = 2;
  PURITY_EFFECTFUL = 3;
}

// Lossless domain failure. The selected variant and all its fields are required
// to preserve recovery decisions; a display string is not its representation.
message Failure {
  message Marker {}
  message PermissionDenied {
    repeated string required = 1;
    repeated string actual = 2;
  }
  message ApprovalPending {
    string approval_key = 1;
    string reason = 2;
  }
  message Quarantined {
    string op_id = 1;
    string reason = 2;
  }
  message ClassifiedError {
    string kind = 1;
    string message = 2;
  }
  message PolicyViolation {
    string policy = 1;
    string detail = 2;
  }
  message PathInvalid {
    Path path = 1;
    string reason = 2;
  }
  oneof kind {
    PermissionDenied permission_denied = 1;
    Path no_handler = 2;
    string budget_exhausted = 3;
    Marker rate_limited = 4;
    ApprovalPending approval_pending = 5;
    Marker timeout = 6;
    Marker cancelled = 7;
    Quarantined quarantined = 8;
    string invalid_input = 9;
    ClassifiedError handler_error = 10;
    Marker kernel_namespace_protected = 11;
    PolicyViolation policy_violation = 12;
    PathInvalid path_invalid = 13;
    ClassifiedError custom = 14;
  }
}

// Outcome of evaluating an Operation / program node.
message Outcome {
  oneof result {
    Value done = 1;
    Failure fail = 2;
    Value short = 3;
  }
}

// Capability literal: <verb>://<scheme>/<segs>[@<predicate>].
message Capability {
  string verb = 1;
  string scheme = 2;
  repeated string segments = 3;
  optional string predicate = 4;
}

message CapSet {
  repeated Capability capabilities = 1;
}
