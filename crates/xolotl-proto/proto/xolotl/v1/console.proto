syntax = "proto3";
package xolotl.v1.console;

import "xolotl/v1/common.proto";

// Top-level frame envelope. Client frames use tags 1-6; server frames use 11-16.
message ConsoleFrame {
  oneof frame {
    ClientHello   hello          = 1;   // client -> server
    bytes         auth_token     = 2;   // client -> server (opaque bearer session token)
    ActionCall    call           = 3;   // client -> server
    StreamCall    subscribe      = 4;   // client -> server
    uint64        unsubscribe    = 5;   // subscription id
    uint64        ping           = 6;   // nonce
    HelloAccepted hello_accepted = 11;  // server -> client
    Authenticated authenticated  = 12;  // server -> client
    Reply         reply          = 13;  // server -> client
    Event         event          = 14;  // server -> client
    uint64        pong           = 15;  // echoes ping
    ConsoleError  error          = 16;  // server -> client
  }
}

message ClientHello {
  uint32 protocol_version = 1;            // must equal CONSOLE_PROTOCOL_VERSION
  string client_name = 2;                 // optional human-readable client id
}

message HelloAccepted {
  ProtocolGreeting metadata = 1;
  TransportSecuritySummary transport = 2; // policy of this adapter, not service authority
}

message Authenticated {
  PrincipalSummary principal = 1;
  ProtocolGreeting metadata = 2;
}

message ProtocolGreeting {
  uint32 protocol_version = 1;
  string server_name = 2;                 // "xolotl-console"
  string wire_encoding = 3;               // "protobuf+xolotl-console-v1"
  uint64 server_rev = 4;                  // observed append head; completion updates do not advance it
  uint64 registry_rev = 5;                // descriptor registry revision
  uint64 server_time_ms = 6;              // wall clock for client skew detection

}

// Host-declared admission policy; does not attest end-to-end TLS.
message TransportSecuritySummary {
  string mode = 1;
  bool unsafe_transport = 2;
  repeated string relaxations = 3;
}

message PrincipalSummary {
  string username = 1;
  string identity_path = 2;               // identity://console/accounts/<account-incarnation>
  uint32 mfa_level = 3;                   // 1 = single-factor, 2 = verified
}

message ActionCall {
  uint64 id = 1;                          // client correlation id
  string action = 2;                      // action id, e.g. "config.write_cas"; required by admission
  xolotl.v1.Value input = 4;             // action input
  optional string scope = 5;              // visibility scope
  optional string justification = 6;      // visibility justification
  optional uint64 ttl_ms = 7;             // visibility TTL
  optional uint64 registry_rev = 8;       // client's descriptor rev (RegistryChanged detection)
}

message StreamCall {
  uint64 id = 1;                          // subscription id
  string stream = 2;                      // stream id, e.g. "state.watch"
  xolotl.v1.Value input = 3;             // stream input / filter
  optional string scope = 4;
  optional string justification = 5;
  optional uint64 ttl_ms = 6;
  optional uint64 registry_rev = 9;       // descriptor/module contract precondition
}

message Reply {
  uint64 id = 1;                          // echoes ActionCall.id
  ActionResult result = 2;
}

message ActionResult {
  optional xolotl.v1.Value output = 1;    // action output
  uint64 server_rev = 2;                  // fact cursor after this action
  optional uint64 registry_rev = 3;       // host populates for every reply, including empty results
  ExecutionReference execution = 5;     // allocated runtime execution; no observation authority
  xolotl.v1.UnresolvedOperations unresolved_operations = 6; // execution may succeed with effects to reconcile
}

message ExecutionReference {
  optional string execution_id = 3;
  string process_id = 1;                 // decimal kernel process ID
  string program_id = 2;                 // lowercase hex content-addressed program ID
}

message Event {
  uint64 stream = 1;                      // subscription id
  ConsoleEvent event = 2;
}

message ConsoleEvent {
  oneof kind {
    StateSet    state_set    = 1;
    StateAppend state_append = 2;
    StateDelete state_delete = 3;
    FactEvent   fact         = 4;
    StateDropPrefixAppend state_drop_prefix_append = 5;
    SubscriptionClosed closed = 6;
    RuntimeEvent runtime = 7;
  }
}

message StateSet {
  xolotl.v1.Path path = 1;
  xolotl.v1.Value value = 2;
  StateSourceSummary source = 3;
}

message StateAppend {
  xolotl.v1.Path path = 1;
  xolotl.v1.Value item = 2;
  StateSourceSummary source = 3;
}

// Replayable list window update. The removed count is the exact number of
// leading members discarded before appending item.
message StateDropPrefixAppend {
  xolotl.v1.Path path = 1;
  uint64 removed = 2;
  xolotl.v1.Value item = 3;
  StateSourceSummary source = 4;
}

message StateDelete {
  xolotl.v1.Path path = 1;
  StateSourceSummary source = 2;
}

// Fixed lineage categories only. Private ingress labels, fetched hosts, and
// protected source paths are never included in a State watch notification.
message StateSourceSummary {
  bool tainted = 1;
  bool author_constant = 2;
  bool model_output = 3;
  bool inbound = 4;
  bool fetched = 5;
  bool protected = 6;
}

message FactEvent {
  xolotl.v1.Value fact = 1;               // projected Fact (redacted per visibility tier)
}

message SubscriptionClosed {
  string reason = 1;
  ConsoleError failure = 2;              // structured failure; absent on normal completion
}

message RuntimeEvent {
  xolotl.v1.Value event = 1;             // discriminated lossless runtime event envelope
}

message ConsoleError {
  ConsoleErrorCode code = 1;
  string message = 2;                     // redacted; never contains secrets/tokens/raw policy
  optional uint64 request_id = 3;         // correlation id when known
  optional uint64 retry_after_ms = 4;     // known delay only; not a safe-retry guarantee
  optional uint32 required_mfa_level = 5; // STEP_UP_REQUIRED
  optional uint64 current_version = 6;    // version observed by failed comparison, when usable
  optional uint64 current_registry_rev = 7; // REGISTRY_CHANGED
  MfaOptions mfa = 9;                    // factor choices after successful primary authentication
  ExecutionReference execution = 11;    // allocated execution, including preparation/timeout failures
  OutcomeUnknownDetail outcome_unknown = 12; // host-authored identity and classified cause; reconcile before retry
  xolotl.v1.UnresolvedOperations unresolved_operations = 13; // other unresolved effects retained through failure
  xolotl.v1.Value runtime_completion = 14;
}

message OutcomeUnknownDetail {
  repeated string operation_ids = 1;    // opaque stable operations or outbound command ids
  string reason = 2;                     // bounded host cause, never remote diagnostic text
}

message MfaOptions {
  repeated MfaFactor factors = 1;
  bool recovery_code_available = 2;
}

message MfaFactor {
  string factor_id = 1;
  string provider_id = 2;
  string label = 3;
  int64 created_at = 4;
  optional int64 last_used_at = 5;
  FactorAvailability availability = 6;
}

enum FactorAvailability {
  FACTOR_AVAILABILITY_UNSPECIFIED = 0;
  PROVIDER_NOT_INSTALLED = 1;
  AUTHENTICATION_DISABLED = 2;
  AVAILABLE = 3;
}

enum ConsoleErrorCode {
  CONSOLE_ERROR_CODE_UNSPECIFIED = 0;
  UNAUTHENTICATED = 1;
  FORBIDDEN = 2;
  STEP_UP_REQUIRED = 3;
  RATE_LIMITED = 4;
  VALIDATION_FAILED = 5;
  ADMISSION_REJECTED = 6;
  VERSION_CONFLICT = 7;
  REGISTRY_CHANGED = 9;
  INTERNAL = 16;
  OUTCOME_UNKNOWN = 17;
}
