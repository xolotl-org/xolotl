syntax = "proto3";
package xolotl.v1;

import "xolotl/v1/common.proto";

message Program {
  DoNode root = 1;
  optional PayloadProvenance provenance = 2;
}

// Portable source uses the same versioned document as the Rust/JSON compiler.
// Transporting a program does not authorize its execution through a Gateway.
message PortableProgram {
  bytes json_source = 1;
  bytes program_id = 2;
}

message PayloadProvenance {
  optional string upload_ticket = 1;
  optional ObjectStoreProof store_proof = 2;
}

message ObjectStoreProof {
  string store_id = 1;
  string proof = 2;
}

message DoNode {
  oneof kind {
    Value pure = 1;
    AndThen and_then = 2;
    OrElse or_else = 3;
    Parallel both = 4;
    Parallel race = 5;
    Let let_ = 6;
    string use_name = 7;
    Acting acting = 8;
    Failure fail = 9;
    WaitSpec wait = 10;
    OperationTemplate op = 11;
  }
}

message AndThen {
  DoNode d = 1;
  StepRef then = 2;
}

message OrElse {
  DoNode d = 1;
  StepRef or = 2;
}

message Parallel {
  DoNode left = 1;
  DoNode right = 2;
}

message Let {
  string name = 1;
  DoNode value = 2;
  DoNode body = 3;
}

message Acting {
  Path identity = 1;
  DoNode body = 2;
}

message WaitSpec {
  oneof kind {
    Path signal = 1;
    int64 deadline_millis = 2;
  }
}

message StepRef {
  // Resolved only in the executor's native module.
  string name = 1;
  optional Value arg = 2;
}

message OperationTemplate {
  Path target = 1;
  string method = 2;
  optional uint64 method_id = 3;
  OutputMode output = 4;
  optional Value literal_input = 5;
}

message OutputMode {
  OutputModeKind kind = 1;
  uint64 collect_limit = 2;
}

enum OutputModeKind {
  OUTPUT_MODE_KIND_UNSPECIFIED = 0;
  OUTPUT_MODE_UNARY = 1;
  OUTPUT_MODE_STREAM = 2;
  OUTPUT_MODE_COLLECT = 3;
  OUTPUT_MODE_ASYNC_PROCESS = 4;
  OUTPUT_MODE_SINK_ONLY = 5;
}
