[package]
name = "nexus-console"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Management-domain Gateway (Web Console backend) for Nexus"

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
argon2 = { workspace = true, features = ["std"] }
axum = { workspace = true, features = ["http1", "json", "tokio", "ws"] }
base64.workspace = true
ed25519-dalek.workspace = true
futures-util.workspace = true
getrandom.workspace = true
hmac.workspace = true
nexus-actors = { workspace = true, features = ["standard"] }
nexus-graph.workspace = true
nexus-kernel.workspace = true
nexus-state.workspace = true
nexus-types.workspace = true
rmp-serde.workspace = true
serde.workspace = true
serde_json.workspace = true
sha1.workspace = true
sha2.workspace = true
subtle.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "macros", "rt-multi-thread", "signal", "time"] }
tower-http = { workspace = true, features = ["trace", "cors"] }

[dev-dependencies]
criterion.workspace = true

[[bench]]
name = "console_protocol"
harness = false
