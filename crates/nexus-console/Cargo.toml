[package]
name = "nexus-console"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Management-domain Gateway (Web Console backend) for Nexus (§18.4)"

[dependencies]
anyhow = "1.0.102"
argon2 = { version = "0.5.3", features = ["std"] }
axum = { version = "0.8.9", features = ["ws", "macros"] }
base64 = "0.22.1"
ed25519-dalek = "2.2.0"
futures = "0.3.32"
getrandom = "0.4.2"
hmac = "0.13.0"
nexus-graph = { version = "0.1.0", path = "../nexus-graph" }
nexus-kernel = { version = "0.1.0", path = "../nexus-kernel" }
nexus-state = { version = "0.1.0", path = "../nexus-state" }
nexus-types = { version = "0.1.0", path = "../nexus-types" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha1 = "0.11.0"
sha2 = "0.11.0"
subtle = "2.6.1"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["rt", "sync", "macros", "rt-multi-thread", "signal", "time"] }
tower-http = { version = "0.6.11", features = ["trace", "cors"] }
tracing = "0.1.44"

[dev-dependencies]
nexus-actors = { version = "0.1.0", path = "../nexus-actors" }
