[package]
name = "nexus-gateway-websocket"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "WebSocket protocol adapter for Nexus"

[lints]
workspace = true

[dependencies]
axum = { workspace = true, default-features = false, features = ["http1", "tokio", "ws"] }
futures-util = { workspace = true, default-features = false, features = ["sink", "std"] }
nexus-gateway.workspace = true
nexus-proto.workspace = true
nexus-types.workspace = true
prost = { workspace = true, default-features = false, features = ["derive", "std"] }
tokio = { workspace = true, default-features = false, features = ["rt", "sync", "time", "macros"] }
tonic = { workspace = true, default-features = false, features = ["codegen"] }
tracing = { workspace = true, default-features = false, features = ["std"] }

[dev-dependencies]
anyhow = { workspace = true, default-features = false, features = ["std"] }
