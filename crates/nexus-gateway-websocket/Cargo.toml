[package]
name = "nexus-gateway-websocket"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "WebSocket protocol adapter (Gateway/Source, §18.1) for Nexus"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
futures = "0.3.32"
nexus-gateway = { version = "0.1.0", path = "../nexus-gateway" }
nexus-graph = { version = "0.1.0", path = "../nexus-graph" }
nexus-kernel = { version = "0.1.0", path = "../nexus-kernel" }
nexus-types = { version = "0.1.0", path = "../nexus-types" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.52.3", features = ["rt", "sync", "time", "macros"] }
tracing = "0.1.44"
