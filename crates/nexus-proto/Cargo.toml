[package]
name = "nexus-proto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description.workspace = true

[lints]
workspace = true

# This crate does not run `protoc` during builds. Rust bindings are checked in
# under `src/{common,program,external}.rs`; `.proto` files under `proto/` remain
# the wire schema.

[dependencies]
nexus-graph.workspace = true
nexus-types.workspace = true
prost = { workspace = true, default-features = false, features = ["derive", "std"] }
thiserror = { workspace = true, default-features = false, features = ["std"] }
tonic = { workspace = true, default-features = false, features = ["codegen", "router", "transport"] }
tonic-prost = { workspace = true, default-features = false }

[dev-dependencies]
anyhow = { workspace = true, default-features = false, features = ["std"] }
criterion = { workspace = true, default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "wire_conversion"
harness = false
