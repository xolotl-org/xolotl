[package]
name = "nexus-proto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description.workspace = true

[lints]
workspace = true

# NOTE: no `protoc` build step. The Rust bindings are hand-vendored in
# `src/{common,program,external}.rs` (faithful to tonic-prost-build 0.14
# output) so this crate builds anywhere prost/tonic resolve. The `.proto` files
# under `proto/` remain the canonical wire schema; keep the two in sync.

[dependencies]
nexus-graph.workspace = true
nexus-types.workspace = true
prost.workspace = true
thiserror.workspace = true
tonic = { workspace = true, features = ["codegen", "router", "transport"] }
tonic-prost.workspace = true

[dev-dependencies]
criterion.workspace = true

[[bench]]
name = "wire_conversion"
harness = false
