syntax = "proto3";
package nexus.v1;

import "nexus/v1/common.proto";

// Gateway service: the primary entry point for external gRPC clients.
// A client authenticates, then submits structured Do<A> programs to run; the
// gateway runs each as a capability-scoped Process and returns the Outcome.
service GatewayService {
  // Run one submitted program and return its outcome.
  rpc Submit(SubmitRequest) returns (SubmitResponse);
  // Health / readiness probe.
  rpc Health(HealthRequest) returns (HealthResponse);
}

message SubmitRequest {
  // Bearer token mapped to a request identity by the gateway.
  string auth_token = 1;
  // Structured Do<A> program, compiled and run by the kernel.
  Program program = 2;
}

message SubmitResponse {
  Outcome outcome = 1;
}

message HealthRequest {}

message HealthResponse {
  bool ready = 1;
  string version = 2;
}

message Program {
  DoNode root = 1;
}

message DoNode {
  oneof kind {
    Value pure = 1;
    AndThen and_then = 2;
    OrElse or_else = 3;
    Parallel both = 4;
    Parallel race = 5;
    Let let_ = 6;
    string use_name = 7;
    Acting acting = 8;
    Failure fail = 9;
    WaitSpec wait = 10;
    OperationTemplate op = 11;
  }
}

message AndThen {
  DoNode d = 1;
  StepRef then = 2;
}

message OrElse {
  DoNode d = 1;
  StepRef or = 2;
}

message Parallel {
  DoNode left = 1;
  DoNode right = 2;
}

message Let {
  string name = 1;
  DoNode value = 2;
  DoNode body = 3;
}

message Acting {
  Path identity = 1;
  DoNode body = 2;
}

message WaitSpec {
  oneof kind {
    Path signal = 1;
    int64 deadline_millis = 2;
  }
}

message StepRef {
  uint64 process_id = 1;
  string name = 2;
  optional Value arg = 3;
}

message OperationTemplate {
  Path target = 1;
  string method = 2;
  optional uint64 method_id = 3;
  OutputMode output = 4;
  optional Value literal_input = 5;
}

message OutputMode {
  OutputModeKind kind = 1;
  uint64 collect_limit = 2;
}

enum OutputModeKind {
  OUTPUT_MODE_KIND_UNSPECIFIED = 0;
  OUTPUT_MODE_UNARY = 1;
  OUTPUT_MODE_STREAM = 2;
  OUTPUT_MODE_COLLECT = 3;
  OUTPUT_MODE_ASYNC_PROCESS = 4;
  OUTPUT_MODE_SINK_ONLY = 5;
}
