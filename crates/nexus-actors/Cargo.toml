[package]
name = "nexus-actors"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Standard in-process Drivers and Providers for Nexus"

[dependencies]
async-trait = "0.1.89"
blake3 = "1.8.5"
chacha20poly1305 = "0.10.1"
getrandom = "0.4.2"
glob = "0.3.3"
hkdf = "0.13.0"
nexus-graph = { version = "0.1.0", path = "../nexus-graph" }
nexus-kernel = { version = "0.1.0", path = "../nexus-kernel" }
nexus-state = { version = "0.1.0", path = "../nexus-state" }
nexus-types = { version = "0.1.0", path = "../nexus-types" }
parking_lot = "0.12.5"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["rt", "sync", "macros", "time", "fs", "process", "io-util"] }
url = "2.5.8"

[dev-dependencies]
criterion = "0.8.2"
tempfile = "3.27.0"

[[bench]]
name = "standard_drivers"
harness = false
