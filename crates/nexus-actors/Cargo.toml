[package]
name = "nexus-actors"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Standard in-process Drivers and Providers for Nexus"

[lints]
workspace = true

[features]
default = ["standard"]
standard = ["standard-core", "fetch", "fs", "mcp", "terminal"]
standard-core = ["external-session", "proc", "dep:blake3", "tokio/time"]
external-session = ["dep:blake3", "dep:chacha20poly1305", "dep:getrandom", "dep:hkdf", "dep:sha2"]
fetch = ["standard-core", "dep:reqwest", "dep:url"]
fs = ["standard-core", "dep:glob", "tokio/fs"]
mcp = ["standard-core"]
proc = ["tokio/io-util", "tokio/process"]
terminal = ["tokio/io-util", "tokio/process"]

[dependencies]
async-trait.workspace = true
blake3 = { workspace = true, optional = true }
chacha20poly1305 = { workspace = true, features = ["alloc"], optional = true }
getrandom = { workspace = true, optional = true }
glob = { workspace = true, optional = true }
hkdf = { workspace = true, optional = true }
nexus-graph.workspace = true
nexus-kernel.workspace = true
nexus-state.workspace = true
nexus-types.workspace = true
parking_lot.workspace = true
reqwest = { workspace = true, features = ["rustls"], optional = true }
serde.workspace = true
serde_json.workspace = true
sha2 = { workspace = true, optional = true }
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "macros"] }
url = { workspace = true, optional = true }

[dev-dependencies]
criterion.workspace = true
tempfile.workspace = true

[[bench]]
name = "standard_drivers"
harness = false
