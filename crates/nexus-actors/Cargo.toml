[package]
name = "nexus-actors"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Standard in-process Drivers and Providers for Nexus (§17)"

[dependencies]
async-trait = "0.1.89"
blake3 = "1.5.4"
chacha20poly1305 = "0.10.1"
futures = "0.3.31"
getrandom = "0.4.2"
glob = "0.3"
hkdf = "0.13.0"
nexus-graph = { version = "0.1.0", path = "../nexus-graph" }
nexus-kernel = { version = "0.1.0", path = "../nexus-kernel" }
nexus-state = { version = "0.1.0", path = "../nexus-state" }
nexus-types = { version = "0.1.0", path = "../nexus-types" }
parking_lot = "0.12.5"
reqwest = { version = "0.13.3", features = ["json", "stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11.0"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["rt", "sync", "macros", "time", "fs", "process", "io-util"] }
tracing = "0.1.44"
url = "2.5.8"

[dev-dependencies]
tempfile = "3.27.0"
