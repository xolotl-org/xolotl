[package]
name = "xolotl-sdk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description.workspace = true

[lints]
workspace = true

[features]
default = []
serde = ["xolotl-core/serde"]
program = ["dep:xolotl-graph", "dep:xolotl-types"]
runtime = ["program", "dep:xolotl-kernel", "dep:xolotl-state"]
host = ["runtime", "xolotl-kernel/host"]
memory = ["host", "xolotl-kernel/memory", "xolotl-state/memory"]
multi-thread = ["host", "xolotl-kernel/multi-thread"]
plan = ["host", "dep:xolotl-plan"]
standard = ["host", "dep:xolotl-standard", "xolotl-standard/standard"]
federation = ["host", "dep:xolotl-federation"]

[dependencies]
xolotl-core.workspace = true
xolotl-standard = { workspace = true, default-features = false, optional = true }
xolotl-graph = { workspace = true, optional = true }
xolotl-kernel = { workspace = true, optional = true }
xolotl-plan = { workspace = true, optional = true }
xolotl-state = { workspace = true, optional = true }
xolotl-types = { workspace = true, optional = true }
xolotl-federation = { workspace = true, optional = true }

[dev-dependencies]
anyhow = { workspace = true, default-features = false, features = ["std"] }
async-trait = { workspace = true, default-features = false }
serde_json = { workspace = true, default-features = false, features = ["std"] }
tempfile = { workspace = true, features = ["getrandom"] }
tokio = { workspace = true, default-features = false, features = ["rt", "sync", "macros", "time"] }
xolotl-storage-fs.workspace = true
xolotl-state = { workspace = true, features = ["memory"] }

[[example]]
name = "portable"
required-features = ["memory"]

[[example]]
name = "native_modules"
required-features = ["memory"]
